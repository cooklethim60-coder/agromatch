name: AgroMatch CI

on:
  push:
    branches: [main, improve/**]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Python syntax and regression tests
        run: |
          python -m compileall -q backend
          python -m pytest -q backend/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and frontend smoke tests
        run: |
          node --check frontend/app.js
          node --check frontend/features.js
          node frontend/tests/smoke.js
